# Calepin 站点配置 —— zzjrabbit.github.io
# 渲染由官方 typst CLI 完成，Calepin 只负责编排（导航/索引/PDF twin/搜索）。

title = "zzj — Mathematics & Physics Notes"
description = "Typst notes and Lean 4 proofs in mathematics and physics."
base-url = "https://zzjrabbit.github.io"

# 本地主题：继承内置 calepin 主题，只覆盖 CSS 与 PDF 版式
theme = "themes/site"

# 每篇笔记同时产出 PDF（即原本的 noteworthy 排版），网页上可切换阅读
pdf = true
# 同时发布 .typ 源码，主题会提供 HTML / PDF / Source 三视图切换
typ = true

feeds = false
search = "pagefind"
minify = true

# 构建到仓库根的 _site/，方便直接作为 GitHub Pages 产物
output-dir = "../_site"

# notes 仓库的内容会同步到站点源目录根部（typ/ models/ lean/），
# 所以页面的 URL 结构与仓库结构一致。
[pages]
exclude = [
  "themes/**",      # 主题文件不是页面
  # 每个集合根目录下的 shared.typ 都是被笔记引用的库（数学的模板函数、物理的
  # CeTZ 绘图原语），没有标题也没有正文。漏掉哪一个，Calepin 都会把它编译成
  # 没有 <h1> 的页面，prepare-starlight.mjs 随后以 “missing title” 中止构建
  # ——typ/ 曾单独列出，物理加入后正是这样失败的，所以这里是约定而不是现状：
  # models/ 今天还没有这个文件，仍然一并排除。tests/pages.test.mjs 检查这里是否
  # 覆盖了 scripts/sync-notes.sh 同步的每个 Typst 集合根目录。
  "typ/shared.typ",
  "phys/shared.typ",
  "physics/shared.typ",
  "models/shared.typ",
]

# 目录页右侧的“本页目录”
[toc]
enabled = true
depth = 2
floating = true

[[menus.main]]
target = "index.typ"
label = "Notes"

[[menus.main]]
target = "https://github.com/zzjrabbit/notes"
label = "Source ↗"

[[footer.item]]
label = "Notes © zzj, CC BY-SA 4.0"

[[footer.item]]
target = "https://github.com/zzjrabbit/notes/blob/main/LICENSE"
label = "License"
